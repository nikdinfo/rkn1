<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="neonBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="25" fill="#0d0d1a"/>
  
  <!-- Outer border -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="none" stroke="#00f3ff" stroke-width="4" filter="url(#neonBlue)"/>
  
  <!-- R text -->
  <text x="50" y="70" font-family="'Inter', sans-serif, Arial" font-weight="900" font-size="55" text-anchor="middle" fill="#ff00ff" filter="url(#neonPink)">R</text>
  <!-- Inner pop -->
  <text x="50" y="70" font-family="'Inter', sans-serif, Arial" font-weight="900" font-size="55" text-anchor="middle" fill="#ffffff">R</text>
</svg>
